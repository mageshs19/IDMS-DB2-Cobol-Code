[project]
name = "idms-db2-code-conversion"
version = "0.1.0"
description = "IDMS COBOL to DB2 COBOL Phase 2 converter"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "streamlit>=1.61.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]